<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI DJ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="eyebrow">AI DJ Application</p>
        <h1>Upload a track and generate a DJ mix.</h1>
        <p class="intro">
          Drop in a source file, send it to the local processing pipeline, then preview the rendered output.
        </p>

        <form id="upload-form" class="upload-section">
          <label class="file-picker" for="audio-file">
            <span>Select audio files</span>
            <input id="audio-file" name="files" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" multiple />
          </label>
          <p id="file-name" class="file-name">No file selected</p>
          <button id="submit-button" class="action-button" type="submit">Upload &amp; Process</button>
        </form>

        <div id="status" class="status" aria-live="polite"></div>

        <section id="player-section" class="player-section hidden">
          <div class="player-header">
            <div>
              <p class="player-label">Processed Mix</p>
              <p id="pair-name" class="pair-name"></p>
              <p id="result-path" class="result-path"></p>
            </div>
            <button id="play-toggle" class="play-toggle" type="button">Play</button>
          </div>

          <div id="pair-list" class="pair-list"></div>
          <div id="style-list" class="style-list"></div>

          <div class="timeline-wrap">
            <span id="current-time" class="timecode">0:00</span>
            <input id="timeline" class="timeline" type="range" min="0" max="100" value="0" step="0.1" />
            <span id="total-time" class="timecode">0:00</span>
          </div>

          <audio id="audio-player" preload="metadata"></audio>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
